<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truman</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

</head>

<body>
    <div id="app">
        <header></header>
        <main>
            <div class="requestPanel">
                <div class="requestFormWrapper">
                    <div class="formType">
                        <div class="sans">GET</div>
                    </div>
                    <form class="apiForm" id="apiForm">
                        <input type="text" name="api" id="input">
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
            <div class="responsePanel">
                <div class="responseWrapper">

                    <div class="tags">
                        <div class="tag status">
                            <h4>Status :</h4>
                            <span id="status" class="ok"></span>
                        </div>
                    </div>
                    <div class="response-output">
                        <div class="response-header">
                            <div class="response-actions">
                                <button class="responseBtn" data-name="json">JSON</button>
                                <button class="responseBtn" data-name="raw">Raw</button>
                            </div>
                        </div>
                        <div class="response-body">
                            <code class="dataWrapper language-json">
                            </code>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer></footer>
    </div>


    <!-- Prism CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
