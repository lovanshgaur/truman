<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truman</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <header>
            <h1>truman</h1>
        </header>
        <main>
            <div class="requestPanel">
                <div class="requestFormWrapper">
                    <form class="apiForm" id="apiForm">
                        <select name="method" id="methodSelect" class="methodSelect sans">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                        <input type="text" name="api" id="input" placeholder="https://jsonplaceholder.typicode.com/posts/1" autocomplete="off">
                        <button type="submit" id="sendBtn">Send</button>
                    </form>
                </div>

                <div class="requestConfig">
                    <div class="requestTabs">
                        <button type="button" class="reqTabBtn active" data-tab="params">Params</button>
                        <button type="button" class="reqTabBtn" data-tab="headers">Headers</button>
                        <button type="button" class="reqTabBtn" data-tab="body">Body</button>
                    </div>

                    <div class="reqTabContent active" id="tab-params">
                        <div class="kvList" id="paramsList"></div>
                        <button type="button" class="addRowBtn" data-target="paramsList">+ Add Param</button>
                    </div>

                    <div class="reqTabContent" id="tab-headers">
                        <div class="kvList" id="headersList"></div>
                        <button type="button" class="addRowBtn" data-target="headersList">+ Add Header</button>
                    </div>

                    <div class="reqTabContent" id="tab-body">
                        <div class="bodyToolbar">
                            <span class="bodyHint">JSON Payload</span>
                            <button type="button" class="formatJsonBtn" id="formatJsonBtn">Format JSON</button>
                        </div>
                        <textarea id="bodyInput" rows="6" placeholder='{\n  "title": "foo",\n  "body": "bar",\n  "userId": 1\n}'></textarea>
                    </div>
                </div>
            </div>

            <div class="responsePanel">
                <div class="responseWrapper">
                    <div class="tags">
                        <div class="tag status">
                            <h4>Status :</h4>
                            <span id="status">-</span>
                        </div>
                    </div>
                    <div class="response-output">
                        <div class="response-header">
                            <div class="response-actions">
                                <button class="responseBtn" data-name="json" disabled>JSON</button>
                                <button class="responseBtn active" data-name="raw">Raw</button>
                            </div>
                        </div>
                        <div class="response-body">
                            <code class="dataWrapper language-json">Enter a URL and click Send.</code>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer></footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
